- name: Pinging the frontend
  become: true
  hosts: frontend
  tasks:
      - name: Ping the server
        ansible.builtin.ping:

      - name: Updating the package
        ansible.builtin.dnf:
          name: "*"
          state: latest
      
      - name: Installing webserver
        ansible.builtin.dnf:
          name: "nginx"
          state: present

      - name: Start and Enable the service
        ansible.builtin.service:
          name: 'nginx'
          state: restarted
          enabled: true
    
      